[package]
name = "lsforms"
version = "1.3.0"
edition = "2024"

[features]
default = [ "static-files" ]
templates = [ "askama" ]
static-files = [ "actix-files" ]

[dependencies]
actix-web = { version = "4.13", default-features = false, features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
toml = { version = "1.1", default-features = false, features = [ "parse", "serde" ] }
lettre = { version = "0.11", features = [ "tokio1-native-tls" ] }
chrono = { version = "0.4", default-features = false }
base64 = "0.22"
regex = { version = "1.12", default-features = false }
altcha-lib-rs = { version = "0.3", features = [ "json" ] }
askama = { version = "0.16", optional = true }
actix-files = { version = "0.6", optional = true }
